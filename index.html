    <!-- the preloader: the open A of ANTICON, with the hairline across the screen through its optical middle (58% down from the apex: the legs spread toward the foot, so the true middle reads high). The line draws out as the page loads, then the screen parts along it -->
    <style>
      @property --k { syntax: '<number>'; inherits: true; initial-value: 0; }
      #pre { --pre-bg: #000; --pre-ink: #f3f1ec; position: fixed; inset: 0; z-index: 100; --k: 0; animation: pre-creep 5s cubic-bezier(0.2, 0.6, 0.3, 1) forwards; }
      #pre[data-js] { animation: none; }
      html[data-theme='light'] #pre { --pre-bg: #f3f1ec; --pre-ink: #121212; }
      @keyframes pre-creep { to { --k: 0.42; } }
      #pre .h { position: absolute; left: 0; right: 0; height: 50%; background: var(--pre-bg); transition: transform 1s cubic-bezier(0.72, 0, 0.18, 1); }
      #pre .t { top: 0; }
      #pre .b { bottom: 0; }
      #pre .a { position: absolute; left: 50%; top: 50%; width: 72px; height: 72px; translate: -50% -50%; fill: var(--pre-ink); transition: opacity 0.45s ease; }
      #pre .l { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--pre-ink); transform: scaleX(calc(0.035 + var(--k) * 0.965)); transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease 0.35s; }
      #pre[data-done] .t { transform: translateY(-100%); }
      #pre[data-done] .b { transform: translateY(100%); }
      #pre[data-done] { pointer-events: none; }
      #pre[data-done] .a { opacity: 0; }
      #pre[data-done] .l { opacity: 0; }
      @media (prefers-reduced-motion: reduce) { #pre .h { transition: opacity 0.4s; } #pre[data-done] .h { transform: none; opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="pre" aria-hidden="true"><div class="h t"></div><div class="h b"></div><svg class="a" viewBox="0 0 64 64"><path transform="translate(14.828 48.800) scale(0.026846 -0.026846)" d="M168.0015869140625 0H24.6654052734375L567.9990234375 1490H713.3348388671875L1254.66845703125 0H1112.6656494140625L644.6669921875 1313.3297119140625H634.6668701171875Z"/></svg><div class="l"></div></div>
    <div id="root"></div>
    <noscript>ANTICON needs JavaScript to play.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
